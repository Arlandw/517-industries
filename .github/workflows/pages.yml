name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Enable pnpm 11.25
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare Pages artifact
        run: |
          cp CNAME dist/client/CNAME
          cp .nojekyll dist/client/.nojekyll
          test -f dist/client/index.html
          test -f dist/client/assets/517-wordmark.svg
          test -f dist/client/favicon.svg
          test -f dist/client/assets/material-study.webp
          grep -q "/assets/517-wordmark.svg" dist/client/index.html
          grep -q "put to work" dist/client/index.html
          grep -q "mailto:hello@517industries.com" dist/client/index.html
          grep -q "Texas, USA" dist/client/index.html
          if grep -Ei 'lu06|frisco|gmail' dist/client/index.html; then
            echo "Published HTML contains a retired mark or a disallowed contact." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
